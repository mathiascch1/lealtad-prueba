<!DOCTYPE html>
<html lang="es"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffffff">
<title>Tarjeta de Lealtad</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
:root{--bg:#f5f3f0;--card:#fff;--ink:#1a1a1a;--mute:#888;--line:#eee;--pri:#E8943A;--pri2:#D4791F;--accent:#F5C400;--ok:#25D366;--bad:#d33}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:'Poppins',system-ui,-apple-system,sans-serif;line-height:1.45;padding-bottom:80px;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}

/* TOP BAR */
.top{position:sticky;top:0;z-index:10;background:#fff;display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line)}
.top h1{font-size:17px;font-weight:700;color:var(--ink)}
.top-r{display:flex;align-items:center;gap:10px}
.fan-badge{background:#FFF3C4;color:#B8860B;border-radius:999px;padding:4px 14px;font-weight:700;font-size:12px;display:flex;align-items:center;gap:4px}
.user-ic{width:28px;height:28px;border-radius:50%;border:1.5px solid #ccc;display:grid;place-items:center;font-size:14px;color:#aaa;cursor:pointer}

/* WRAP */
.wrap{max-width:540px;margin:0 auto;padding:16px}

/* HELLO */
.hello{background:var(--card);border-radius:18px;padding:16px;display:flex;align-items:center;gap:14px;margin-bottom:16px;box-shadow:0 1px 4px #0001}
.logo{width:72px;height:72px;border-radius:50%;background:#f0ede8;display:grid;place-items:center;font-size:32px;flex:none;border:2px solid #e8e4de}
.hello-txt h2{font-size:18px;font-weight:700;margin:0}.hello-txt p{color:var(--mute);font-size:13px;margin:2px 0}.hello-txt b{font-size:14px}

/* LOYALTY CARD */
.lc{background:linear-gradient(155deg,#f0c987 0%,#e8a54a 35%,#d68c2e 100%);border-radius:22px;padding:20px;margin-bottom:16px;position:relative;overflow:hidden;color:#fff;box-shadow:0 8px 24px rgba(200,140,40,.25)}
.lc::after{content:'';position:absolute;top:-50px;right:-50px;width:180px;height:180px;background:radial-gradient(circle,rgba(255,255,255,.18) 0%,transparent 70%);border-radius:50%}
.lc-head{display:flex;align-items:flex-start;gap:10px;position:relative;z-index:1;margin-bottom:6px}
.lc-ico{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.25);display:grid;place-items:center;font-size:16px;flex:none}
.lc-head-txt{flex:1}.lc-head-txt b{font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.3px;display:block}.lc-head-txt small{font-size:12px;opacity:.85}
.lc-active{background:#FFF3C4;color:#7a6100;border-radius:999px;padding:3px 12px;font-weight:700;font-size:11px;white-space:nowrap;flex:none;align-self:flex-start}
.lc-prize-name{font-size:14px;font-weight:600;margin:4px 0 10px;opacity:.9;position:relative;z-index:1}

/* How dropdown */
.lc-how{background:#fff;border-radius:14px;margin:0 0 12px;position:relative;z-index:1}
.lc-how summary{font-weight:600;font-size:14px;padding:12px 16px;cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;color:var(--ink)}
.lc-how summary::after{content:"∨";color:#aaa;font-size:14px}
.lc-how p{margin:0;padding:0 16px 12px;font-size:13px;color:var(--mute);line-height:1.5}

/* Counter */
.lc-count{display:flex;justify-content:space-between;align-items:center;position:relative;z-index:1;margin-bottom:4px}
.lc-count small{font-size:14px;opacity:.85;display:block;margin-bottom:2px}
.lc-nums{font-size:56px;font-weight:900;line-height:1;letter-spacing:-2px}
.lc-nums i{font-style:normal;font-size:20px;font-weight:600;margin:0 3px}
.lc-label{font-size:15px;font-weight:700;margin-top:2px}
.lc-img{width:80px;height:80px;border-radius:16px;background:rgba(255,255,255,.2);display:grid;place-items:center;font-size:38px;flex:none}
.lc-info{display:flex;align-items:center;gap:4px;font-size:13px;opacity:.85;position:relative;z-index:1}

/* Faltan text */
.lc-faltan{font-size:13px;margin:8px 0 6px;opacity:.9;position:relative;z-index:1}
.lc-faltan b{font-weight:800}

/* Prize pill */
.lc-gift{background:#FFF3C4;color:#5a4600;border-radius:999px;padding:11px 16px;font-weight:800;text-align:center;text-transform:uppercase;font-size:12px;letter-spacing:.3px;display:flex;align-items:center;justify-content:center;gap:8px;margin:4px 0 14px;position:relative;z-index:1}

/* Dots / Stamps */
.stamps{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;position:relative;z-index:1;margin-bottom:6px}
.stamp{display:flex;flex-direction:column;align-items:center;gap:3px}
.stamp-circle{width:48px;height:48px;border-radius:50%;border:2px dashed rgba(255,255,255,.45);display:grid;place-items:center;font-size:16px;transition:all .3s}
.stamp-circle.filled{background:rgba(255,255,255,.35);border:2px solid rgba(255,255,255,.5)}
.stamp-circle.gift-stamp{background:#FFF3C4;border:2px solid #FFE066}
.stamp-num{font-size:11px;opacity:.7;font-weight:600}
.stamp-circle.filled .stamp-icon{font-size:18px}
@keyframes pop{from{transform:scale(.4)}to{transform:scale(1)}}
.stamp-circle.filled{animation:pop .35s}

/* Progress bar */
.lc-bar{height:6px;border-radius:5px;background:rgba(255,255,255,.25);margin:8px 0;overflow:hidden;position:relative;z-index:1}
.lc-bar i{display:block;height:100%;background:rgba(255,255,255,.6);border-radius:5px;transition:width .5s}

.lc-end{font-size:11px;opacity:.65;text-align:center;position:relative;z-index:1;margin-top:6px}

/* CARDS */
.card{background:var(--card);border-radius:18px;padding:18px;margin-bottom:12px;box-shadow:0 1px 4px #0001}
.card h2,.card h3{margin:0 0 8px;font-weight:700}
.mute{color:var(--mute)}.small{font-size:13px}.center{text-align:center}

/* FORMS */
label{display:block;font-weight:600;font-size:12px;margin:12px 0 4px;text-transform:uppercase;letter-spacing:.3px;color:var(--mute)}
input{width:100%;padding:13px 14px;border:1.5px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);font-family:'Poppins',sans-serif;font-size:16px;outline:none;-webkit-appearance:none;transition:border-color .2s}
input:focus{border-color:var(--pri);box-shadow:0 0 0 3px rgba(232,148,58,.12)}
.btn{width:100%;border:0;border-radius:14px;padding:15px;font-family:'Poppins',sans-serif;font-weight:700;font-size:15px;color:#fff;background:var(--pri);cursor:pointer;margin-top:10px;min-height:50px;transition:transform .15s}
.btn:active{transform:scale(.97)}
.btn.accent{background:#FFF3C4;color:#5a4600}
.btn.dark{background:#222;color:#fff}
.btn.ghost{background:#f5f3f0;color:var(--ink);box-shadow:none}
.err{color:var(--bad);font-size:13px;min-height:18px;margin:5px 0 0}

/* Banner */
.ban{background:#FFF3C4;border-radius:16px;padding:14px 16px;margin-bottom:14px;font-weight:700;font-size:14px;display:flex;align-items:center;gap:10px}
.ban small{display:block;font-weight:500;margin-top:2px;font-size:12px}
.ban-ico{font-size:22px;flex:none}

/* Code display */
.code-box{font-size:32px;font-weight:800;letter-spacing:.12em;text-align:center;background:#f5f3f0;border:2px dashed #ddd;border-radius:16px;padding:16px 8px;margin:12px 0;font-family:'Poppins',monospace}

/* Tabs */
.tabs{display:flex;background:#f5f3f0;border-radius:999px;padding:4px;margin-bottom:14px}
.tabs button{flex:1;border:0;background:none;color:var(--mute);font-family:'Poppins',sans-serif;font-weight:600;padding:10px;border-radius:999px;cursor:pointer;min-height:44px;transition:all .2s;font-size:13px}
.tabs button.on{background:#fff;color:var(--ink);box-shadow:0 1px 4px #0001}

/* Admin stats */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.stats div{background:#fff;border-radius:14px;padding:12px;text-align:center;box-shadow:0 1px 4px #0001}
.stats b{display:block;font-size:22px;color:var(--pri)}.stats small{color:var(--mute);font-size:11px;text-transform:uppercase}

/* Admin rows */
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:11px 0;border-top:1px solid var(--line)}
.acts{display:flex;gap:5px}.acts button{border:0;border-radius:10px;padding:10px 13px;font-family:'Poppins',sans-serif;font-weight:700;cursor:pointer;font-size:12px;min-height:40px}
.add-btn{background:var(--pri);color:#fff}.del-btn{background:var(--ok);color:#fff}.und-btn{background:#f0ede8;color:var(--mute)}
.tag{background:var(--ok);color:#fff;border-radius:99px;font-size:11px;padding:2px 8px;margin-left:4px}
.kv{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line)}.kv span{color:var(--mute);font-size:13px}.kv b{text-align:right;word-break:break-all;font-size:13px}
.nm{background:none;border:0;padding:0;font-family:'Poppins',sans-serif;font-weight:700;color:var(--ink);cursor:pointer;text-align:left;text-decoration:underline dotted;font-size:14px}
.lnk{background:none;border:0;color:var(--mute);text-decoration:underline;font-family:'Poppins',sans-serif;font-size:13px;cursor:pointer;min-height:44px}
details.set summary{font-weight:700;cursor:pointer;padding:6px 0}

/* Nosotros */
.info-card{background:#fff;border-radius:18px;padding:18px;margin-bottom:12px;box-shadow:0 1px 4px #0001}
.info-head{display:flex;align-items:center;gap:10px;margin-bottom:4px}
.info-ico{width:36px;height:36px;border-radius:50%;background:#f0ede8;display:grid;place-items:center;font-size:16px;flex:none}
.soc{display:flex;gap:24px;margin-top:12px}.soc a,.soc div{text-align:center;font-size:12px;color:var(--mute);text-decoration:none;cursor:pointer}
.soc-ico{display:block;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;margin:0 auto 4px}
.soc-ig{background:#fce4ec}.soc-wa{background:#e8f5e9}.soc-tk{background:#f5f5f5}
.info-svg{width:22px;height:22px;flex:none}

/* PROFILE */
.prof-avatar{width:56px;height:56px;border-radius:50%;background:#555;color:#fff;display:grid;place-items:center;font-size:22px;font-weight:700;flex:none}
.prof-card{background:#fff;border-radius:18px;padding:18px;margin-bottom:12px;box-shadow:0 1px 4px #0001;border:1px solid #f0edea}
.nivel-card{border-radius:18px;padding:18px;margin-bottom:10px;border:1px solid transparent}
.nivel-fan{background:linear-gradient(135deg,#f3e8ff 0%,#ede4ff 100%);border-color:#e0d4f5}
.nivel-vip{background:linear-gradient(135deg,#fff4e6 0%,#ffecd2 100%);border-color:#f5ddb8}
.nivel-elite{background:linear-gradient(135deg,#fff4e6 0%,#ffecd2 100%);border-color:#f5ddb8}
.nivel-ico{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:20px;flex:none}
.nivel-ico.fan{background:#c084fc;color:#fff}.nivel-ico.vip{background:#fb923c;color:#fff}.nivel-ico.elite{background:#f59e0b;color:#fff}
.nivel-tag{border-radius:999px;padding:3px 12px;font-weight:700;font-size:11px;white-space:nowrap}
.nivel-tag.current{background:#10b981;color:#fff}
.nivel-tag.next{background:#e5e7eb;color:#888}
.datos-row{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid #f5f3f0}
.datos-row:last-child{border-bottom:none}
.datos-ico{color:#aaa;font-size:18px;width:24px;text-align:center;flex:none}
.datos-label{color:var(--mute);font-size:14px;flex:1}
.datos-val{font-weight:600;font-size:14px;text-align:right}
.prog-bar{height:5px;border-radius:5px;background:#e5e7eb;margin:8px 0 4px;overflow:hidden}
.prog-bar i{display:block;height:100%;border-radius:5px;background:#c084fc;transition:width .5s}
.btn-logout{width:100%;border:1.5px solid #fca5a5;border-radius:16px;padding:14px;font-family:'Poppins',sans-serif;font-weight:600;font-size:14px;color:#ef4444;background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;margin-top:8px}

/* BOTTOM NAV */
.nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:flex;padding:4px 0 calc(4px + env(safe-area-inset-bottom,0px));z-index:10}
.nav button{flex:1;border:0;background:none;color:#bbb;font-family:'Poppins',sans-serif;font-size:10px;font-weight:600;cursor:pointer;padding:4px;min-height:50px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;transition:color .2s}
.nav button span{font-size:20px;display:flex;align-items:center;justify-content:center}.nav button.on{color:var(--ink)}

/* Floating QR */

/* QR section */
.qr-box{background:#fff;border-radius:16px;padding:20px;display:inline-block;box-shadow:0 2px 10px #0001}
.qr-title{font-weight:800;font-size:16px;color:var(--pri);text-align:center;margin-bottom:2px}
.qr-sub{font-size:11px;color:#888;text-align:center;margin-bottom:10px}
.qr-foot{font-size:10px;color:#888;text-align:center;margin-top:8px}

/* Toast */
.toast{position:fixed;bottom:calc(80px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%) translateY(200px);background:#333;color:#fff;padding:11px 20px;border-radius:12px;font-size:13px;font-weight:600;box-shadow:0 4px 16px #0003;transition:transform .3s,opacity .3s;z-index:100;white-space:nowrap;max-width:calc(100vw - 32px);opacity:0;pointer-events:none}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1;pointer-events:auto}
.db-badge{font-size:11px;color:var(--mute);text-align:center;padding:8px;opacity:.7}

/* Wallet button */
.btn-wallet{width:100%;border:0;border-radius:14px;padding:14px;font-family:'Poppins',sans-serif;font-weight:700;font-size:14px;color:#fff;background:#222;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;margin-top:10px;min-height:50px;transition:transform .15s}
.btn-wallet:active{transform:scale(.97)}
.btn-wallet svg{width:24px;height:24px}
.wallet-ok{background:#e8f5e9;border-radius:14px;padding:12px 16px;font-size:13px;color:#2e7d32;display:flex;align-items:center;gap:8px;margin-top:10px;font-weight:600}

button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
@media(prefers-reduced-motion:reduce){.stamp-circle.filled{animation:none}}
@media print{body *{visibility:hidden}.qr-print,.qr-print *{visibility:visible}.qr-print{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}}
</style></head>
<body>
<div class="top">
  <h1 id="biz" data-a="nav" data-v="inicio" style="cursor:pointer"></h1>
  <div class="top-r">
    <span class="fan-badge" id="badge">❤️ Fan</span>
    <div class="user-ic" data-a="nav" data-v="perfil">👤</div>
  </div>
</div>
<div class="wrap" id="main"></div>
<nav class="nav" id="nav"></nav>
<div class="toast" id="toast"></div>

<script>
// ================================================================
//  🔥 FIREBASE CONFIG — PEGA TU CONFIGURACIÓN AQUÍ
// ================================================================
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyCb4p_3ZXqF8e-BXkgJrLMmAqiH9cLH4wk",
  authDomain: "prueba-lealtad-1.firebaseapp.com",
  projectId: "prueba-lealtad-1",
  storageBucket: "prueba-lealtad-1.firebasestorage.app",
  messagingSenderId: "872202791403",
  appId: "1:872202791403:web:b580cfda7a9556034cd1ae",
  measurementId: "G-7SY9D7SBN8"
};

// ================================================================
//  📱 WALLETWALLET CONFIG
// ================================================================
// Coordenadas del local (para geofencing — notificación al pasar cerca)
const BUSINESS_LAT = -6.7701;   // Lambayeque, Perú
const BUSINESS_LNG = -79.9069;

// ================================================================
//  STORAGE
// ================================================================
let fb=null,useFB=false;
const LS='lealtad-v2';
function lsR(){try{return JSON.parse(localStorage.getItem(LS))||null}catch{return null}}
function lsW(d){try{localStorage.setItem(LS,JSON.stringify(d))}catch{}}
const dflt=()=>({cfg:{name:'Cafetería Mi tostadita',cat:'Cafetería',addr:'Av. Principal 234, Lambayeque',hrs:'LUNES A DOMINGO: 4PM - 11PM',prize:'Capuccino totalmente gratis',meta:6,end:'30 de noviembre de 2026',pin:'1234',ig:'',wa:'',tk:''},clients:[],log:[],me:null});
let D=lsR()||dflt();

async function initFB(){
  if(!FIREBASE_CONFIG)return false;
  try{
    const{initializeApp}=await import('https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js');
    const m=await import('https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js');
    const app=initializeApp(FIREBASE_CONFIG);
    fb={db:m.getFirestore(app),...m};return true;
  }catch(e){console.error('FB init:',e);return false}
}
async function fbLoad(){
  if(!fb)return;const{db,doc,getDoc,collection,getDocs}=fb;
  try{
    const cs=await getDoc(doc(db,'config','main'));if(cs.exists())D.cfg={...dflt().cfg,...cs.data()};
    const sn=await getDocs(collection(db,'clients'));D.clients=[];sn.forEach(d=>D.clients.push({id:d.id,...d.data()}));
    D.clients.sort((a,b)=>(b.t||0)-(a.t||0));
    const ls=await getDocs(collection(db,'log'));D.log=[];ls.forEach(d=>D.log.push(d.data()));
    D.log.sort((a,b)=>(b.t||0)-(a.t||0));D.log=D.log.slice(0,30);
    lsW(D);
  }catch(e){console.error('FB load:',e)}
}
async function fbSaveC(c){if(!fb)return;try{await fb.setDoc(fb.doc(fb.db,'clients',c.id),{...c})}catch(e){console.error(e)}}
async function fbDelC(id){if(!fb)return;try{await fb.deleteDoc(fb.doc(fb.db,'clients',id))}catch(e){console.error(e)}}
async function fbSaveCfg(){if(!fb)return;try{await fb.setDoc(fb.doc(fb.db,'config','main'),{...D.cfg})}catch(e){console.error(e)}}
async function fbLog(e){if(!fb)return;try{await fb.setDoc(fb.doc(fb.db,'log','l'+Date.now()),e)}catch(e2){console.error(e2)}}
function save(){lsW(D)}

// ================================================================
//  WALLET PASS
// ================================================================
async function walletCreate(c){
  try{
    const res=await fetch('/api/create-pass',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        clientName:c.n,
        clientPhone:c.p,
        stamps:c.s,
        maxStamps:D.cfg.meta,
        prize:D.cfg.prize,
        businessName:D.cfg.name,
        businessAddr:D.cfg.addr,
        businessLat:BUSINESS_LAT,
        businessLng:BUSINESS_LNG,
        walletColor:D.cfg.wColor||'',
        walletLogo:D.cfg.wLogo||'',
        walletStrip:D.cfg.wStrip||'',
        walletIcon:D.cfg.wIcon||'',
        siteUrl:location.origin
      })
    });
    if(!res.ok){const et=await res.text();console.error('API:',res.status,et);throw new Error(res.status+': '+et)}
    const data=await res.json();
    if(data.serial){
      c.walletSerial=data.serial;
      c.walletUrl=data.shareUrl;
      save();await fbSaveC(c);
    }
    return data;
  }catch(e){console.error('walletCreate error:',e.message);return null}
}

async function walletUpdate(c){
  if(!c.walletSerial)return;
  try{
    await fetch('/api/update-pass',{
      method:'PUT',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        serial:c.walletSerial,
        stamps:c.s,
        maxStamps:D.cfg.meta,
        prize:D.cfg.prize,
        hasReward:c.r
      })
    });
  }catch(e){console.error('walletUpdate:',e)}
}

// ================================================================
//  STATE
// ================================================================
let view='inicio',adminOk=false,pinErr=false,q='',flash='',sel=null,showAll=false,lm='new',justReg=null,editMode=false;
// Guardar datos del form de registro al cambiar de pestaña
let draftNm='',draftPh='',draftEm='',draftCd='';
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
const hm=t=>new Date(t).toLocaleTimeString('es-PE',{hour:'2-digit',minute:'2-digit'});
const fd=t=>t?new Date(t).toLocaleDateString('es-PE',{day:'numeric',month:'short',year:'numeric'}):'—';
const me=()=>D.clients.find(c=>c.id===D.me);
const addLog=(k,txt)=>{const e={k,txt,t:Date.now()};D.log.unshift(e);D.log=D.log.slice(0,30);fbLog(e)};
const AL='ABCDEFGHJKMNPQRSTUVWXYZ23456789';
const ncode=x=>String(x).toUpperCase().replace(/[^A-Z0-9]/g,'');
function newCode(){let c;do{c='';for(let i=0;i<6;i++)c+=AL[Math.floor(Math.random()*AL.length)];c=c.slice(0,3)+'-'+c.slice(3)}while(D.clients.some(x=>x.code===c));return c}
let _toastT;function showToast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(_toastT);_toastT=setTimeout(()=>t.classList.remove('show'),2500)}
let _flashT;function setFlash(m){flash=m;render();clearTimeout(_flashT);if(m)_flashT=setTimeout(()=>{flash='';render()},3500)}
addEventListener('storage',e=>{if(e.key===LS&&document.activeElement.tagName!=='INPUT'){D=lsR()||dflt();render()}});

function loginHTML(title){
  const g=justReg&&D.clients.find(c=>c.id===justReg);
  if(g)return`<div class="card center"><h2>¡Listo, ${esc(g.n.split(' ')[0])}! 🎉</h2><p class="mute">Ya estás registrado. Para volver a entrar solo necesitas tu <b>número de celular</b>.</p><div class="code-box">${esc(g.p)}</div><button class="btn" data-a="goCard">Ver mi tarjeta ⭐</button></div>`;
  const tabs=`<div class="tabs"><button class="${lm==='new'?'on':''}" data-a="lm" data-v="new">Soy nuevo</button><button class="${lm==='code'?'on':''}" data-a="lm" data-v="code">Ya tengo cuenta</button></div>`;
  const body=lm==='code'
    ?`<p class="mute small">Ingresa el número de celular con el que te registraste.</p><label for="cd">Tu número de celular</label><input id="cd" inputmode="numeric" maxlength="9" placeholder="Ej. 987654321" autocomplete="tel" value="${esc(draftCd)}"><p class="err" id="e1"></p><button class="btn" data-a="clogin">Ver mi tarjeta</button>`
    :`<p class="mute small">Regístrate una sola vez. Sin descargas ni contraseñas.</p>
      <label for="nm">Tu nombre</label><input id="nm" placeholder="Ej. María García" autocomplete="name" value="${esc(draftNm)}">
      <label for="ph">Número de celular</label><input id="ph" inputmode="numeric" maxlength="9" placeholder="Ej. 987654321" autocomplete="tel" value="${esc(draftPh)}">
      <label for="em">Correo electrónico <span style="font-weight:400;text-transform:none">(opcional)</span></label><input id="em" type="email" placeholder="tucorreo@ejemplo.com" autocomplete="email" value="${esc(draftEm)}">
      <p class="err" id="e1"></p><button class="btn" data-a="creg">Registrarme ⭐</button>`;
  return`<div class="card"><h2 style="font-size:18px">${title}</h2>${tabs}${body}</div>`;
}

function cardHTML(c,full){
  const m=D.cfg.meta,f=m-c.s;
  let stamps='';
  for(let i=0;i<m;i++){
    const isLast=i===m-1;
    const filled=i<c.s;
    if(isLast){
      stamps+=`<div class="stamp"><div class="stamp-circle gift-stamp ${filled?'filled':''}">${filled?'⭐':'🎁'}</div><div class="stamp-num">${i+1}</div></div>`;
    }else{
      stamps+=`<div class="stamp"><div class="stamp-circle ${filled?'filled':''}">${filled?'☕':''}</div><div class="stamp-num">${i+1}</div></div>`;
    }
  }

  const howBlock=full?`<details class="lc-how"><summary>¿Cómo ganas un sello?</summary><p>Haz tu compra y dile tu nombre o número de celular al cajero. Él te suma el sello. Al juntar ${m} sellos, ¡tu premio es gratis!</p></details>`:'';

  return`<div class="lc">
  <div class="lc-head"><div class="lc-ico">☕</div><div class="lc-head-txt"><b>Queremos premiar tu fidelidad</b><small>Acumula sellos y gana tu premio</small></div><span class="lc-active">Campaña activa</span></div>
  ${howBlock}
  <div class="lc-count"><div><small>Ya llevas</small><div class="lc-nums">${c.s}<i>de</i>${m}</div><div class="lc-label">compras</div></div><div class="lc-img">☕</div></div>
  ${!full?`<div class="lc-bar"><i style="width:${c.s/m*100}%"></i></div>`:''}
  <p class="lc-faltan">${c.r?'¡Completaste tu tarjeta! Pide tu premio:':`Te faltan solo <b>${f} compras</b> para ganar:`}</p>
  <div class="lc-gift">🎁 ${esc(D.cfg.prize)}</div>
  ${full?`<div class="stamps">${stamps}</div>`:''}
  <p class="lc-end">Finaliza el ${esc(D.cfg.end)}</p>
  ${!full?'<div style="text-align:right;position:relative;z-index:1;margin-top:4px"><button class="lnk" style="color:rgba(255,255,255,.8);font-size:12px" data-a="nav" data-v="inicio">Ver detalle →</button></div>':''}
  </div>`;
}

function perfilHTML(){
  const c=me();if(!c)return loginHTML('Inicia sesión');
  const tot=c.tot||0,rw=c.rw||0;
  const initial=c.n.trim().charAt(0).toUpperCase();
  // Levels: Fan 0-14, VIP 15-29, Élite 30+
  const lvl=tot>=30?'elite':tot>=15?'vip':'fan';
  const lvlName=lvl==='elite'?'Élite':lvl==='vip'?'VIP':'Fan';
  const nextLvl=lvl==='fan'?'VIP':lvl==='vip'?'Élite':null;
  const nextAt=lvl==='fan'?15:lvl==='vip'?30:30;
  const prog=nextLvl?Math.min(100,Math.round(tot/nextAt*100)):100;
  const faltan=nextLvl?nextAt-tot:0;

  if(editMode){
    return`<h2 style="font-size:20px;font-weight:700;text-align:center;margin:0 0 16px">Editar mis datos</h2>
    <div class="prof-card">
      <label for="en">Nombre</label><input id="en" value="${esc(c.n)}">
      <label for="ep">Teléfono</label><input id="ep" inputmode="numeric" maxlength="9" value="${esc(c.p)}">
      <label for="ee">Correo electrónico <span style="font-weight:400;text-transform:none">(opcional)</span></label><input id="ee" type="email" value="${esc(c.em||'')}">
      <label for="eb">Cumpleaños <span style="font-weight:400;text-transform:none">(opcional)</span></label><input id="eb" type="date" value="${esc(c.bday||'')}">
      <p class="err" id="e3"></p>
      <button class="btn" data-a="saveprof">Guardar</button>
      <button class="btn ghost" data-a="canceledit">Cancelar</button>
    </div>`;
  }

  return`<h2 style="font-size:20px;font-weight:700;text-align:center;margin:0 0 16px">Mi perfil</h2>
  <div class="prof-card" style="display:flex;align-items:center;gap:14px">
    <div class="prof-avatar">${initial}</div>
    <div><b style="font-size:16px">${esc(c.n)}</b></div>

  <h3 style="font-size:16px;font-weight:700;margin:18px 0 10px">Mi nivel</h3>
  <div class="nivel-card nivel-fan">
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:8px">
      <div class="nivel-ico fan">💜</div>
      <div style="flex:1"><b style="color:#7c3aed;font-size:16px">Fan</b><br><span class="mute small">¡Gracias por acompañarnos! Cada visita te acerca a sorpresas y beneficios pensados para ti.</span></div>
      ${lvl==='fan'?'<span class="nivel-tag current">Tu nivel actual</span>':''}
    </div>
    ${lvl==='fan'?`<div class="prog-bar"><i style="width:${prog}%"></i></div><div style="display:flex;justify-content:space-between;align-items:center"><span class="mute small">${tot} de ${nextAt} visitas</span><span class="mute small">${prog}%</span></div><p class="small" style="margin:4px 0 0"><b>Te faltan ${faltan} visitas para alcanzar VIP.</b></p>`:''}
  </div>

  <div class="nivel-card nivel-vip">
    <div style="display:flex;align-items:center;gap:12px">
      <div class="nivel-ico vip">⭐</div>
      <div style="flex:1"><b style="font-size:16px">VIP</b><br><span class="mute small">Tu lealtad se recompensa. Prepárate para disfrutar de ventajas y beneficios exclusivos.</span></div>

function adminList(){
  const k=norm(q.trim()),kc=ncode(q);let L=D.clients.slice();
  L=k?L.filter(c=>norm(c.n).includes(k)||c.p.includes(q.trim())||(c.em&&norm(c.em).includes(k))||(kc.length>=3&&ncode(c.code).includes(kc))):L.sort((a,b)=>(b.t||0)-(a.t||0));
  const more=!k&&!showAll&&L.length>8;if(!k&&!showAll)L=L.slice(0,8);
  if(!L.length&&q.trim())return`<p class="mute">No se encontró «${esc(q)}».</p><label for="np">Registrar como nuevo</label><input id="np" inputmode="numeric" maxlength="9" placeholder="Celular 9 dígitos"><label for="ne">Correo <span style="font-weight:400;text-transform:none">(opcional)</span></label><input id="ne" type="email" placeholder="correo@ejemplo.com"><p class="err" id="e2"></p><button class="btn" data-a="newc">Registrar a ${esc(q)}</button>`;
  if(!L.length)return`<p class="mute center small">Los clientes aparecerán aquí al registrarse.</p>`;
  return L.map(c=>`<div class="row"><div><button class="nm" data-a="sel" data-id="${c.id}">${esc(c.n)}</button>${c.r?'<span class="tag">Premio</span>':''}<br><span class="mute small">${esc(c.code)} · ${c.s}/${D.cfg.meta} · ${c.em?esc(c.em):esc(c.p)}</span></div>
  <div class="acts">${c.s>0?`<button class="und-btn" data-a="undo" data-id="${c.id}">↩</button>`:''}${c.r?`<button class="del-btn" data-a="deliver" data-id="${c.id}">Entregar</button>`:`<button class="add-btn" data-a="add" data-id="${c.id}">+ Sello</button>`}</div></div>`).join('')
  +(more?`<p class="center"><button class="lnk" data-a="all">Ver todos (${D.clients.length})</button></p>`:(!k&&showAll?`<p class="center"><button class="lnk" data-a="all">Ver recientes</button></p>`:''));
}

  <div class="card"><h3 style="font-size:15px">Buscar cliente</h3><input id="q" value="${esc(q)}" placeholder="Nombre, celular, correo o código" autocomplete="off"><div id="list" style="margin-top:8px">${adminList()}</div></div>
  <div class="card"><h3 style="font-size:15px">Código QR del negocio</h3><p class="mute small" style="margin-bottom:10px">Imprime y pon en tu mostrador.</p><div class="center"><div class="qr-box qr-print"><div class="qr-title">${esc(D.cfg.name)}</div><div class="qr-sub">Programa de Lealtad</div><div id="qrC"></div><div class="qr-foot">Escanea para registrarte ⭐</div></div></div>
  <div style="display:flex;gap:6px;margin-top:10px;justify-content:center"><button class="btn" style="width:auto;padding:10px 18px;font-size:13px" data-a="printqr">🖨️ Imprimir</button><button class="btn accent" style="width:auto;padding:10px 18px;font-size:13px" data-a="dlqr">📥 Descargar</button></div></div>
  <div class="card"><h3 style="font-size:15px">Movimientos</h3>${log}</div>
  <div class="card"><details class="set"><summary>⚙️ Ajustes del negocio</summary>
  <label for="cn">Nombre del negocio</label><input id="cn" value="${esc(D.cfg.name)}">
  <label for="cc">Categoría</label><input id="cc" value="${esc(D.cfg.cat||'')}">
  <label for="cp">Premio</label><input id="cp" value="${esc(D.cfg.prize)}">
  <label for="cm">Sellos para ganar (3 a 10)</label><input id="cm" inputmode="numeric" value="${D.cfg.meta}">
  <label for="ce">Válido hasta</label><input id="ce" value="${esc(D.cfg.end)}">
  <label for="ca">Dirección</label><input id="ca" value="${esc(D.cfg.addr||'')}">
  <label for="ch">Horario</label><input id="ch" value="${esc(D.cfg.hrs||'')}">
  <label for="ck">Clave del cajero</label><input id="ck" value="${esc(D.cfg.pin)}">
  <details style="margin-top:12px"><summary style="font-size:13px;font-weight:600;cursor:pointer">🎨 Diseño de Wallet (opcional)</summary>
  <label for="wc" style="margin-top:8px">Color del pase (hex)</label><input id="wc" placeholder="#E8943A" value="${esc(D.cfg.wColor||'')}">
  <label for="wl">URL del logo (160×160 PNG)</label><input id="wl" placeholder="https://..." value="${esc(D.cfg.wLogo||'')}">
  <label for="ws">URL del banner (1080×360 PNG)</label><input id="ws" placeholder="https://..." value="${esc(D.cfg.wStrip||'')}">
  <label for="wi">URL del ícono (120×120 PNG)</label><input id="wi" placeholder="https://..." value="${esc(D.cfg.wIcon||'')}">
  <p class="mute small">Sube tus imágenes a <a href="https://imgur.com" target="_blank">imgur.com</a> o similar y pega el link directo.</p>
  </details>
  <button class="btn" data-a="cfg">Guardar ajustes</button></details></div>
  <p class="db-badge">${useFB?'🔥 Conectado a Firebase — datos en la nube':'💾 Datos locales — configura Firebase para persistencia'}</p>`;
}

// ================================================================
//  RENDER
// ================================================================
function render(){
  $('#biz').textContent=D.cfg.name;
  const c=me();
  const tot=c?(c.tot||0):0;
  const lvl=tot>=30?'Élite':tot>=15?'VIP':'Fan';
  $('#badge').innerHTML=`❤️ ${c?lvl:'Nuevo'}`;
  $('#main').innerHTML=view==='inicio'?inicioHTML():view==='premios'?premiosHTML():view==='catalogo'?catalogoHTML():view==='nosotros'?nosotrosHTML():view==='perfil'?perfilHTML():adminHTML();

  const NI={inicio:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>',catalogo:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>',premios:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 12 20 22 4 22 4 12"/><rect x="2" y="7" width="20" height="5"/><line x1="12" y1="22" x2="12" y2="7"/><path d="M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7z"/><path d="M12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z"/></svg>',nosotros:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="2" width="16" height="20" rx="2"/><path d="M9 22v-4h6v4"/><path d="M8 6h.01M16 6h.01M12 6h.01M8 10h.01M16 10h.01M12 10h.01M8 14h.01M16 14h.01M12 14h.01"/></svg>'};
  const N=[['inicio',NI.inicio,'Inicio'],['catalogo',NI.catalogo,'Catálogo'],['premios',NI.premios,'Premios'],['nosotros',NI.nosotros,'Nosotros']];
  $('#nav').style.display=view==='admin'?'none':'flex';
  $('#nav').innerHTML=N.map(n=>`<button class="${view===n[0]?'on':''}" data-a="nav" data-v="${n[0]}"><span>${n[1]}</span>${n[2]}</button>`).join('');

  // QR
  const qc=document.getElementById('qrC');
  if(qc){try{const qr=qrcode(0,'M');qr.addData(location.href.split('?')[0]);qr.make();const sz=170,m=qr.getModuleCount(),cs=sz/m,cv=document.createElement('canvas');cv.width=sz;cv.height=sz;cv.id='qrEl';const ctx=cv.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,sz,sz);ctx.fillStyle='#D4791F';for(let r=0;r<m;r++)for(let c=0;c<m;c++)if(qr.isDark(r,c))ctx.fillRect(c*cs,r*cs,cs+.5,cs+.5);qc.innerHTML='';qc.appendChild(cv)}catch(e){}}
}

// ================================================================
//  EVENTS
// ================================================================
document.addEventListener('click',async e=>{
  const el=e.target.closest('[data-a]');if(!el)return;
  const a=el.dataset.a,id=el.dataset.id,c=D.clients.find(x=>x.id===id),m=D.cfg.meta;

  if(a==='nav'){view=el.dataset.v;flash='';window.scrollTo(0,0)}
  else if(a==='lm'){
    // Guardar datos del form actual antes de cambiar pestaña
    const _nm=$('#nm'),_ph=$('#ph'),_em=$('#em'),_cd=$('#cd');
    if(_nm)draftNm=_nm.value;if(_ph)draftPh=_ph.value;if(_em)draftEm=_em.value;if(_cd)draftCd=_cd.value;
    lm=el.dataset.v;
  }
  else if(a==='clogin'){
    const k=$('#cd').value.replace(/\D/g,'');
    if(k.length!==9||k[0]!=='9'){$('#e1').textContent='Ingresa un celular válido de 9 dígitos que empiece con 9.';return}
    const x=D.clients.find(z=>z.p===k);
    if(!x){$('#e1').textContent='Número no encontrado. Verifica tu celular.';return}
    draftCd='';D.me=x.id;
  }
  else if(a==='creg'){
    const n=$('#nm').value.trim(),p=$('#ph').value.replace(/\D/g,''),em=$('#em').value.trim();
    if(!n){$('#e1').textContent='Escribe tu nombre.';return}
    if(p.length!==9||p[0]!=='9'){$('#e1').textContent='Ingresa un celular válido de 9 dígitos que empiece con 9.';return}
    if(em&&!/^\S+@\S+\.\S+$/.test(em)){$('#e1').textContent='El correo no es válido.';return}
    if(D.clients.some(z=>z.p===p)){$('#e1').textContent='Ese celular ya está registrado. Usa "Ya tengo cuenta".';return}
    const x={id:'c'+Date.now(),n,p,em,code:newCode(),s:0,r:false,t:Date.now(),at:Date.now(),tot:0,rw:0};
    D.clients.push(x);addLog('n','Nuevo: '+n);justReg=x.id;
    draftNm='';draftPh='';draftEm='';
    await fbSaveC(x);showToast('¡Registrado! 🎉');
  }
  else if(a==='addwallet'){
    const cw=me();if(!cw)return;
    // Verificar si hay backend disponible
    el.disabled=true;el.innerHTML='Conectando...';
    const wr=await walletCreate(cw);
    if(wr&&wr.shareUrl){showToast('¡Tarjeta guardada! 📱');window.open(wr.shareUrl,'_blank')}
    else{
      el.disabled=false;el.innerHTML='<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="3"/><path d="M2 10h20"/><rect x="14" y="14" width="4" height="2" rx="1"/></svg> Guardar en Apple / Google Wallet';
      showToast('Wallet no disponible por ahora');
    }
  }
  else if(a==='goCard'){D.me=justReg;justReg=null}
  else if(a==='sel')sel=id;
  else if(a==='selx')sel=null;
  else if(a==='all')showAll=!showAll;
  else if(a==='clogout'){D.me=null;editMode=false;view='inicio'}
  else if(a==='editprof')editMode=true;
  else if(a==='canceledit')editMode=false;
  else if(a==='saveprof'){
    const c2=me();if(!c2)return;
    const n=$('#en').value.trim(),p=$('#ep').value.replace(/\D/g,''),em=$('#ee').value.trim(),bd=$('#eb').value;
    if(!n){$('#e3').textContent='Escribe tu nombre.';return}
    if(p.length!==9||p[0]!=='9'){$('#e3').textContent='Celular válido de 9 dígitos que empiece con 9.';return}
    if(em&&!/^\S+@\S+\.\S+$/.test(em)){$('#e3').textContent='El correo no es válido.';return}
    if(p!==c2.p&&D.clients.some(z=>z.p===p&&z.id!==c2.id)){$('#e3').textContent='Ese celular ya está registrado por otro usuario.';return}
    c2.n=n;c2.p=p;c2.em=em;c2.bday=bd||'';
    editMode=false;await fbSaveC(c2);showToast('Datos actualizados ✓');
  }
  else if(a==='alogin'){
    if($('#pin').value===D.cfg.pin){adminOk=true;pinErr=false;if(useFB)await fbLoad();else{const d=lsR();if(d)D=d}
      if(window._qrPhone){const fc=D.clients.find(x=>x.p===window._qrPhone);if(fc)sel=fc.id;window._qrPhone=null}}
    else pinErr=true;
  }
  else if(a==='alogout'){adminOk=false;view='inicio';q='';flash=''}
  else if(a==='add'&&c&&!c.r){
    c.s++;c.tot=(c.tot||0)+1;c.t=Date.now();
    if(c.s>=m){c.s=m;c.r=true}
    addLog('s',`+1 a ${c.n} (${c.s}/${m})`);
    await fbSaveC(c);walletUpdate(c);setFlash(`✅ Sello a ${esc(c.n)}: ${c.s}/${m}${c.r?' ¡Premio!':''}`);showToast('+1 sello ⭐');
  }
  else if(a==='undo'&&c){
    c.s=Math.max(0,c.s-1);c.tot=Math.max(0,(c.tot||0)-1);c.r=false;
    addLog('u','−1 a '+c.n);setFlash('↩ Se quitó 1 sello a '+esc(c.n));
    await fbSaveC(c);walletUpdate(c);
  }
  else if(a==='deliver'&&c){
    c.s=0;c.r=false;c.t=Date.now();c.rw=(c.rw||0)+1;
    addLog('p','Premio: '+c.n);setFlash('🎁 Premio entregado a '+esc(c.n));
    await fbSaveC(c);showToast('Premio entregado 🎁');
  }
  else if(a==='newc'){
    const p=$('#np').value.replace(/\D/g,''),em=$('#ne')?.value.trim()||'';
    if(p.length!==9||p[0]!=='9'){$('#e2').textContent='Celular válido de 9 dígitos que empiece con 9.';return}
    const nc={id:'c'+Date.now(),n:q.trim(),p,em,code:newCode(),s:0,r:false,t:Date.now(),at:Date.now(),tot:0,rw:0};
    D.clients.push(nc);addLog('n','Nuevo: '+nc.n);
    setFlash('👤 '+esc(nc.n)+' — Código: '+nc.code);
    await fbSaveC(nc);
  }
  else if(a==='delclient'){
    if(!confirm('¿Eliminar cliente permanentemente?'))return;
    D.clients=D.clients.filter(x=>x.id!==id);sel=null;
    addLog('d','Eliminado');setFlash('Cliente eliminado');
    await fbDelC(id);
  }
  else if(a==='cfg'){
    const mm=parseInt($('#cm').value,10);
    if(!(mm>=3&&mm<=10)){showToast('Sellos: 3 a 10');return}
    if(!$('#ck').value.trim()){showToast('Pon una clave');return}
    const wc=$('#wc'),wl=$('#wl'),ws=$('#ws'),wi=$('#wi');
    D.cfg={name:$('#cn').value.trim()||'Mi negocio',cat:$('#cc').value.trim()||'Cafetería',prize:$('#cp').value.trim()||'Premio',meta:mm,end:$('#ce').value.trim(),addr:$('#ca').value.trim(),hrs:$('#ch').value.trim(),pin:$('#ck').value.trim(),wColor:wc?wc.value.trim():'',wLogo:wl?wl.value.trim():'',wStrip:ws?ws.value.trim():'',wIcon:wi?wi.value.trim():''};
    D.clients.forEach(x=>{if(x.s>=mm){x.s=mm;x.r=true}else x.r=false});
    await fbSaveCfg();setFlash('💾 Ajustes guardados');
    if(useFB)for(const cl of D.clients)await fbSaveC(cl);
    showToast('Guardado ✓');
  }
  else if(a==='printqr'){window.print();return}
  else if(a==='dlqr'){
    const cv=document.getElementById('qrEl');if(!cv)return;
    const d=document.createElement('canvas'),w=400,h=460;d.width=w;d.height=h;
    const ctx=d.getContext('2d');ctx.fillStyle='#fff';ctx.beginPath();ctx.roundRect(0,0,w,h,20);ctx.fill();
    ctx.fillStyle='#D4791F';ctx.font='bold 22px Poppins,sans-serif';ctx.textAlign='center';ctx.fillText(D.cfg.name,w/2,42);
    ctx.fillStyle='#888';ctx.font='13px Poppins,sans-serif';ctx.fillText('Programa de Lealtad',w/2,64);
    ctx.drawImage(cv,(w-210)/2,84,210,210);
    ctx.fillStyle='#555';ctx.font='13px Poppins,sans-serif';ctx.fillText('Escanea para registrarte ⭐',w/2,340);
    const a2=document.createElement('a');a2.download='qr-lealtad.png';a2.href=d.toDataURL('image/png');a2.click();return;
  }
  save();render();
});

document.addEventListener('input',e=>{if(e.target.id==='q'){q=e.target.value;$('#list').innerHTML=adminList()}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.tagName==='INPUT'&&e.target.id!=='q'){const b=document.querySelector('.btn[data-a]');if(b)b.click()}});

// ================================================================
//  INIT
// ================================================================
(async()=>{
  useFB=await initFB();
  if(useFB)await fbLoad();
  // Detectar QR escaneado: ?c=TELEFONO
  const urlP=new URLSearchParams(location.search);
  const qrPhone=urlP.get('c');
  if(qrPhone){
    history.replaceState(null,'',location.pathname);
    view='admin';
    // Si ya es admin, seleccionar cliente directo
    if(adminOk){
      const fc=D.clients.find(x=>x.p===qrPhone);
      if(fc)sel=fc.id;
    }
    // Guardar teléfono para seleccionar después del PIN
    window._qrPhone=qrPhone;
  }
  render();
})();
</script>
</body></html>
